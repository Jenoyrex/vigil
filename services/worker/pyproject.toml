[project]
name = "vigil-worker"
version = "0.1.0"
description = "Vigil evaluation worker - job storage layer (ClickHouse evaluation_results, PostgreSQL evaluation_jobs lifecycle)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
    "clickhouse-connect>=1.7.2",
    "psycopg[binary]>=3.2.0",
    "vigil-evaluator[embedding]",
]

[tool.uv.sources]
# Local monorepo path dependency, not a published package -- services/evaluator
# is the "one process, imported as a library" arrangement ADR 004 section 4
# and ADR 005 section 6 describe. Note: services/worker's own top-level
# importable package is `worker` (see [tool.hatch.build.targets.wheel] below),
# deliberately not `app` -- services/evaluator's own package is `app`, and two
# distinct top-level packages named `app` cannot coexist in one Python
# process/environment. services/evaluator (already reviewed/shipped) keeps its
# name; services/worker was renamed to resolve the collision.
vigil-evaluator = { path = "../evaluator" }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["worker", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
