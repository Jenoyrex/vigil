[project]
name = "vigil-evaluator"
version = "0.1.0"
description = "Vigil Evaluation Engine - evaluator interface and evaluators"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
# Only required by app/embedding_relevance.py -- the experimental embedding-based relevance
# candidate. The V1 TF-IDF evaluator (app/relevance.py) never imports this and does not need it;
# see README.md's "Embedding relevance evaluator (experimental)" section for why this stays an
# extra rather than a base dependency: it is not yet the production evaluator, and its dependency
# footprint (ONNX Runtime, tokenizers, huggingface-hub) is real and worth not forcing on every
# install of this package.
embedding = [
    "fastembed>=0.8.0,<0.9.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
